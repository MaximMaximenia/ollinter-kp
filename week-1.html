<title>Ollinter: неделя 2–6 ноября</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;900&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Светлая тема. Короткий список результатов недели */
:root{
  --blue:#1659ff; --blue-soft:#e9efff; --green:#1d8a5e; --green-soft:#e4f3ec;
  --ink:#101722; --ink-2:#55606e; --ink-3:#8b95a3;
  --paper:#fff; --page:#f4f6f8; --line:#e2e6eb;
  --shadow:0 1px 2px rgba(16,23,34,.04), 0 10px 28px -18px rgba(16,23,34,.2);
  --display:'Golos Text','Segoe UI',Tahoma,sans-serif;
  --body:'Manrope','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.55;-webkit-font-smoothing:antialiased}
.wrap{max-width:760px;margin:0 auto;padding-inline:20px;padding-block:0 80px}
h1{font-family:var(--display);margin:0;font-size:clamp(30px,5vw,46px);line-height:1.05;font-weight:900;letter-spacing:-.025em}
p{margin:0}
ul{margin:0;padding-left:0;list-style:none}
.eyebrow{font-size:11.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--blue);font-weight:700}

.topbar{border-bottom:1px solid var(--line);background:var(--page)}
.topbar-in{max-width:760px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--display);font-weight:900;font-size:16px;letter-spacing:-.02em}
.brand span{color:var(--blue)}
.when{margin-left:auto;font-size:13.5px;color:var(--ink-3)}

.hero{padding-block:clamp(32px,6vw,60px) 10px;display:grid;gap:12px}

.list{margin-top:24px;display:grid;gap:10px;counter-reset:n}
.item{counter-increment:n;background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);
      padding:18px 20px;display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.item::before{content:counter(n);font-family:var(--display);font-weight:900;font-size:13px;color:#fff;background:var(--blue);
              width:28px;height:28px;border-radius:9px;display:grid;place-items:center}
.item b{font-family:var(--display);font-size:17.5px;font-weight:700}

.done{margin-top:22px;border:2px solid var(--green);border-radius:18px;background:var(--green-soft);
      padding:20px 24px;font-family:var(--display);font-weight:700;font-size:17.5px;color:#14563c}
footer{border-top:1px solid var(--line);margin-top:30px;padding-top:16px;font-size:13.5px;color:var(--ink-3)}
</style>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">Oll<span>inter</span></div>
    <div class="when">2–6 ноября</div>
  </div>
</div>

<div class="wrap">
  <header class="hero">
    <p class="eyebrow">План на неделю</p>
    <h1>Что будет готово за неделю</h1>
  </header>

  <div class="list">
    <div class="item"><b>Структура страницы, на которую ведём рекламу</b></div>
    <div class="item"><b>Рекламные креативы</b></div>
    <div class="item"><b>Брендбук</b></div>
    <div class="item"><b>Аналитика</b></div>
    <div class="item"><b>Зарегистрированные аккаунты</b></div>
  </div>

  <div class="done">К концу недели практически всё подготовлено для старта.</div>

  <footer>Ollinter · неделя 1</footer>
</div>
