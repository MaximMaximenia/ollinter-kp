<title>Ollinter: статус проекта</title>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800;900&family=Manrope:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#0d1117; --ink-2:#4a5560; --ink-3:#8a95a1;
  --paper:#fff; --page:#f2f3f5; --line:#dfe3e8;
  --accent:#1659ff; --win:#117a52; --win-soft:#e2f3eb;
  --warn:#b3690c; --warn-soft:#fdf1e0; --hot:#e8336d; --hot-soft:#ffe9f1;
  --r:5px;
  --display:'Golos Text','Segoe UI',Tahoma,sans-serif;
  --body:'Manrope','Segoe UI',Tahoma,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:720px;margin:0 auto;padding-inline:18px;padding-block:0 80px}
h1,h2{font-family:var(--display);margin:0}
h1{font-size:clamp(30px,5vw,46px);line-height:1.02;font-weight:900;letter-spacing:-.03em}
h2{font-size:21px;font-weight:800;letter-spacing:-.02em}
p{margin:0}
a{color:var(--accent)}
.topbar{border-bottom:1px solid var(--line);background:var(--page)}
.topbar-in{max-width:720px;margin:0 auto;padding:12px 18px;display:flex;gap:12px;align-items:center}
.brand{font-family:var(--display);font-weight:900;font-size:15.5px}
.brand span{color:var(--accent)}
.when{margin-left:auto;font-size:13px;color:var(--ink-3)}
.hero{padding-block:clamp(28px,5vw,50px) 4px;display:grid;gap:10px}
.kicker{display:inline-block;font-family:var(--display);font-size:11px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;background:var(--ink);color:#fff;padding:6px 11px;border-radius:var(--r);justify-self:start}
.sec{margin-top:26px;display:grid;gap:10px}
.sh{display:flex;gap:10px;align-items:baseline}
.pill{font-size:11px;font-weight:800;padding:4px 10px;border-radius:var(--r);letter-spacing:.07em;text-transform:uppercase}
.p-done{background:var(--win-soft);color:var(--win)}
.p-work{background:var(--warn-soft);color:var(--warn)}
.p-left{background:var(--hot-soft);color:var(--hot)}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;display:grid;gap:2px}
.row{display:flex;gap:11px;align-items:center;padding:9px}
.row .tx{font-size:16px}
.done-mark{color:var(--win);font-weight:800}
label.row{cursor:pointer;border-radius:var(--r)}
label.row:hover{background:#f7f9fb}
label.row input{appearance:none;width:20px;height:20px;flex:none;border:2px solid #cfd6de;border-radius:var(--r);background:#fff;cursor:pointer;position:relative}
label.row input:checked{background:var(--win);border-color:var(--win)}
label.row input:checked::after{content:"";position:absolute;left:5px;top:1px;width:5px;height:10px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(42deg)}
label.row input:checked~.tx{color:var(--ink-3);text-decoration:line-through;text-decoration-color:#c7cfd8}
footer{border-top:1px solid var(--line);margin-top:30px;padding-top:16px;font-size:13px;color:var(--ink-3)}
</style>

<div class="topbar">
  <div class="topbar-in">
    <div class="brand">Oll<span>inter</span></div>
    <div class="when">6 ноября</div>
  </div>
</div>

<div class="wrap">
  <header class="hero">
    <span class="kicker">Статус проекта</span>
    <h1>Где мы сейчас</h1>
  </header>

  <div class="sec">
    <div class="sh"><span class="pill p-done">Готово</span></div>
    <div class="card">
      <div class="row"><span class="done-mark">✓</span><span class="tx">Анализ рынка Германии</span></div>
      <div class="row"><span class="done-mark">✓</span><span class="tx">База креативов конкурентов</span></div>
      <div class="row"><span class="done-mark">✓</span><span class="tx">Дизайн утверждён</span></div>
      <div class="row"><span class="done-mark">✓</span><span class="tx">Рекламные кабинеты настроены</span></div>
    </div>
  </div>

  <div class="sec">
    <div class="sh"><span class="pill p-work">В работе</span></div>
    <div class="card">
      <label class="row"><input type="checkbox"><span class="tx">Наполнение сайта</span></label>
      <label class="row"><input type="checkbox"><span class="tx">Производство креативов</span></label>
      <label class="row"><input type="checkbox"><span class="tx">Посты для соцсетей</span></label>
    </div>
  </div>

  <div class="sec">
    <div class="sh"><span class="pill p-left">Осталось до запуска</span></div>
    <div class="card">
      <label class="row"><input type="checkbox"><span class="tx">Доделать дизайн и наполнение сайта</span></label>
      <label class="row"><input type="checkbox"><span class="tx">Готовые креативы</span></label>
      <label class="row"><input type="checkbox"><span class="tx">Аккаунты в Instagram, TikTok, YouTube</span></label>
      <label class="row"><input type="checkbox"><span class="tx">Проверить аналитику</span></label>
      <label class="row"><input type="checkbox"><span class="tx">Запуск рекламы</span></label>
    </div>
  </div>

  <footer>Ollinter · статус на 6 ноября 2026</footer>
</div>

<script>
(function(){
  var KEY='ollinter-status-v2';
  var boxes=[].slice.call(document.querySelectorAll('label.row input'));
  function save(){ try{ localStorage.setItem(KEY,JSON.stringify(boxes.map(function(b){return b.checked?1:0}))); }catch(e){} }
  document.addEventListener('change',function(e){ if(e.target.matches('label.row input')) save() });
  boxes.forEach(function(b){ b.checked=false });
  try{ var s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s) boxes.forEach(function(b,i){ b.checked=!!s[i] }); }catch(e){}
})();
</script>
